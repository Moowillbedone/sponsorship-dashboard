<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>비공개 전환됨</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#08110d;color:#e9f1ed;padding:24px;
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  .box{max-width:430px;text-align:center;border:1px solid rgba(255,255,255,.08);
       border-radius:16px;padding:40px 32px;background:rgba(255,255,255,.025)}
  .dot{width:9px;height:9px;border-radius:50%;background:#5e7269;display:inline-block;margin-bottom:18px}
  h1{font-size:19px;margin:0 0 12px;font-weight:700;letter-spacing:-.01em}
  p{margin:0;color:#9fb4ab;font-size:13.5px;line-height:1.75}
</style>
</head>
<body>
  <div class="box">
    <span class="dot"></span>
    <h1>비공개로 전환되었습니다</h1>
    <p>이 주소에서는 더 이상 서비스가 제공되지 않습니다.<br />관련 문의는 담당 부서로 전달해 주세요.</p>
  </div>
</body>
</html>
