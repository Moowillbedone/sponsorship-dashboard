<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>404 Not Found</title>
<style>
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;
       background:#fbf4e4;color:#123a5e;padding:28px;
       font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .wrap{text-align:center;max-width:420px;width:100%}
  .code{font-size:clamp(64px,17vw,104px);font-weight:800;line-height:1;letter-spacing:-.03em;margin:0}
  svg{width:min(230px,62vw);height:auto;display:block;margin:14px auto 10px}
  .msg{font-size:clamp(19px,5vw,25px);font-weight:800;letter-spacing:.03em;margin:0 0 12px}
  .sub{font-size:13px;color:#7d9ab4;margin:0;line-height:1.6}
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <svg viewBox="0 0 200 150" fill="none" stroke="#123a5e" stroke-width="7"
         stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Not found">
      <rect x="6" y="6" width="188" height="138" rx="16" fill="#fbf4e4"/>
      <path d="M6 40h188" />
      <circle cx="26" cy="23" r="4.5" fill="#7d9ab4" stroke="none"/>
      <circle cx="44" cy="23" r="4.5" fill="#7d9ab4" stroke="none"/>
      <circle cx="62" cy="23" r="4.5" fill="#7d9ab4" stroke="none"/>
      <path d="M68 70l26 26M94 70l-26 26" />
      <path d="M132 70l26 26M158 70l-26 26" />
      <path d="M72 126a30 30 0 0 1 56 0" />
      <path d="M170 46c0 0-9 12-9 18a9 9 0 0 0 18 0c0-6-9-18-9-18z" fill="#123a5e" stroke="none"/>
    </svg>
    <p class="msg">NOT FOUND</p>
    <p class="sub">The requested URL was not found on this server.</p>
  </div>
</body>
</html>
